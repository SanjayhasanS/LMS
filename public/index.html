<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pathory - Learn Anything, Anytime</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#312e81">
</head>
<body>
<nav id="nav"></nav>
<div class="container" style="text-align:center; padding-top: 4rem;">
    <h1 style="font-size:2.5rem;">Welcome to Pathory</h1>
    <p style="color:var(--text-muted); font-size:1.1rem; max-width:600px; margin:0 auto 2rem;">
        Learn new skills with courses taught by real instructors — track your progress, watch video lessons, and download resources, all in one place.
    </p>
    <div style="display:flex; gap:1rem; justify-content:center;">
        <a href="courses.html"><button>Browse Courses</button></a>
        <span id="authButtons"></span>
    </div>
</div>

<script src="js/api.js"></script>
<script>
renderNav();

const user = getUser();
const authButtonsEl = document.getElementById('authButtons');
if (!user) {
    authButtonsEl.innerHTML = `<a href="signup.html"><button class="secondary">Get Started</button></a>`;
}
</script>
</body>
</html>
